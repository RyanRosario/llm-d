apiVersion: v1
kind: ServiceAccount
metadata:
  name: gke-pod-snapshots-nvidia-gpu-sglang-sa
  namespace: llm-d-gke-pod-snapshots
automountServiceAccountToken: false
---
apiVersion: podsnapshot.gke.io/v1
kind: PodSnapshotStorageConfig
metadata:
  name: sglang-pod-snapshot-storage-config
  namespace: llm-d-gke-pod-snapshots
spec:
  snapshotStorageConfig:
    gcs:
      bucket: "ryanrosario-gke-dev-sglang-pod-snapshots"
      path: "/"
      tokenSource: "podKSA"
---
apiVersion: podsnapshot.gke.io/v1
kind: PodSnapshotPolicy
metadata:
  name: sglang-pod-snapshot-policy
  namespace: llm-d-gke-pod-snapshots
spec:
  storageConfigName: sglang-pod-snapshot-storage-config
  selector:
    matchLabels:
      app: sglang-snapshot-demo
  triggerConfig:
    type: workload
    postCheckpoint: resume
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sglang-decode
  namespace: llm-d-gke-pod-snapshots
  labels:
    app: sglang-snapshot-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sglang-snapshot-demo
  template:
    metadata:
      labels:
        app: sglang-snapshot-demo
    spec:
      serviceAccountName: gke-pod-snapshots-nvidia-gpu-sglang-sa
      runtimeClassName: gvisor
      nodeSelector:
        sandbox.gke.io/runtime: gvisor
      containers:
        - name: modelserver
          image: docker.io/lmsysorg/sglang:v0.5.19
          command: ["python3", "-m", "docker.scripts.snapshot.sglang.launcher"]
          args:
            - "--model-path"
            - "Qwen/Qwen3-32B"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8000"
            - "--tp"
            - "1"
            - "--enable-memory-saver"
            - "--enable-weights-cpu-backup"
            - "--mem-fraction-static"
            - "0.90"
            - "--context-length"
            - "8192"
            - "--enable-metrics"
            - "--disable-custom-all-reduce"
          env:
            - name: PYTHONPATH
              value: "/workspace"
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: SNAPSHOT_PROVIDER
              value: "gke_gvisor"
            - name: MODEL_CACHE_DIR
              value: "~/.cache/huggingface/hub"
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: llm-d-hf-token
                  key: HF_TOKEN
          ports:
            - name: modelserver
              containerPort: 8000
              protocol: TCP
          resources:
            limits:
              cpu: "16"
              memory: 128Gi
              nvidia.com/gpu: "1"
            requests:
              cpu: "8"
              memory: 96Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - mountPath: /dev/shm
              name: shm
            - mountPath: /.cache
              name: torch-compile-cache
            - mountPath: /.triton
              name: triton-cache
            - mountPath: /.config
              name: sglang-config
            - mountPath: /workspace/docker/scripts/snapshot
              name: snapshot-scripts
              readOnly: true
            - mountPath: /workspace/docker/scripts/snapshot/sglang
              name: snapshot-scripts-sglang
              readOnly: true
          startupProbe:
            httpGet:
              path: /health
              port: modelserver
            initialDelaySeconds: 10
            periodSeconds: 2
            timeoutSeconds: 5
            failureThreshold: 1800
          livenessProbe:
            httpGet:
              path: /health
              port: modelserver
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: modelserver
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
      volumes:
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 20Gi
        - name: torch-compile-cache
          emptyDir: {}
        - name: triton-cache
          emptyDir: {}
        - name: sglang-config
          emptyDir: {}
        - name: snapshot-scripts
          configMap:
            name: snapshot-scripts
        - name: snapshot-scripts-sglang
          configMap:
            name: snapshot-scripts-sglang
---
apiVersion: v1
kind: Service
metadata:
  name: sglang-service
  namespace: llm-d-gke-pod-snapshots
spec:
  selector:
    app: sglang-snapshot-demo
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
